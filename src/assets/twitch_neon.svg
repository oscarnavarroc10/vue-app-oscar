<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>Neon-style stream platform icon</title>
  <defs>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feFlood flood-color="#9146ff" flood-opacity="1" result="c"/>
      <feComposite in="c" in2="blur1" operator="in" result="glow1"/>
      <feGaussianBlur stdDeviation="16" in="glow1" result="glow2"/>
      <feMerge>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
  </defs>
  <g filter="url(#glow)">
    
    <path d="M120 95h240l42 46v145l-84 84h-66l-46 47v-47h-86z" stroke="#9b59ff" stroke-width="14" stroke-linejoin="round"/>
    <line x1="208" y1="180" x2="208" y2="252" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <line x1="286" y1="180" x2="286" y2="252" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    
  </g>
</svg>
