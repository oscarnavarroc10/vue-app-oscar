<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>Neon-style short video note icon</title>
  <defs>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur1"/>
      <feFlood flood-color="#7a3cff" flood-opacity="1" result="c"/>
      <feComposite in="c" in2="blur1" operator="in" result="glow1"/>
      <feGaussianBlur stdDeviation="16" in="glow1" result="glow2"/>
      <feMerge>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
  </defs>
