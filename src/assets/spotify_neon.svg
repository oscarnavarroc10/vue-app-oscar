<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Círculo base -->
  <circle cx="60" cy="60" r="50" stroke="#1DB954" stroke-width="4" fill="none" filter="url(#glow)"></circle>

  <!-- Ondas -->
  <path d="M35 50C50 45 70 48 85 55" stroke="#1DB954" stroke-width="4" stroke-linecap="round" filter="url(#glow)"></path>
  <path d="M40 65C55 60 70 62 80 68" stroke="#1DB954" stroke-width="3" stroke-linecap="round" filter="url(#glow)"></path>
  <path d="M45 78C55 75 65 76 75 80" stroke="#1DB954" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"></path>
</svg>