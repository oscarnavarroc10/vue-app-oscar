<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />

    <!-- Base -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="canonical" href="https://impulsocuentas.com/" />

    <!-- PWA / App -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.ico" color="#000000" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />

    <!-- iPhone / Mobile App Mode -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Impulso Cuentas" />
    <meta name="format-detection" content="telephone=no" />

    <!-- SEO -->
    <title>
      Impulso Cuentas | Seguidores, Likes y Marketing Digital para Redes Sociales
    </title>

    <meta
      name="description"
      content="Impulsa tu presencia en redes sociales con seguidores, likes, views y paquetes personalizados para Instagram, Facebook, TikTok, YouTube y más."
    />

    <meta
      name="keywords"
      content="seguidores instagram, likes facebook, views reels, marketing digital, redes sociales, paquetes redes sociales, social media, crecimiento instagram, crecimiento tiktok, impulsar negocio en redes"
    />

    <meta name="author" content="Impulso Cuentas" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:locale" content="es_MX" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Impulso Cuentas | Seguidores, Likes y Marketing Digital"
    />
    <meta
      property="og:description"
      content="Haz crecer tu negocio en redes sociales con paquetes, servicios personalizados y soluciones digitales para impulsar tu marca."
    />
    <meta property="og:url" content="https://impulsocuentas.com/" />
    <meta property="og:site_name" content="Impulso Cuentas" />
    <meta
      property="og:image"
      content="https://impulsocuentas.com/og-cover.jpg"
    />
    <meta
      property="og:image:alt"
      content="Impulso Cuentas - Marketing Digital y Redes Sociales"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Impulso Cuentas | Seguidores, Likes y Marketing Digital"
    />
    <meta
      name="twitter:description"
      content="Impulsa tu presencia en redes sociales con paquetes y servicios personalizados para tu negocio."
    />
    <meta
      name="twitter:image"
      content="https://impulsocuentas.com/og-cover.jpg"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Impulso Cuentas",
        "url": "https://impulsocuentas.com/",
        "logo": "https://impulsocuentas.com/icons/apple-touch-icon.png",
        "description": "Servicios de impulso y marketing digital para redes sociales.",
        "sameAs": [
          "https://www.instagram.com/impulacuentas_/",
          "https://facebook.com/"
        ]
